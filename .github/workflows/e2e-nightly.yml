name: E2E Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: e2e-nightly
  cancel-in-progress: true

jobs:
  e2e-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [firefox, webkit, mobile-chrome, mobile-safari, tablet]
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.runCommand('ping').ok\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGO_URL: mongodb://localhost:27017
      E2E_DB_NAME: memoryhub_e2e
      DB_NAME: memoryhub_e2e
      JWT_SECRET: e2e-jwt-secret-at-least-32-characters-long
      ENV: development
      EMAIL_PROVIDER: fake
      ANALYZER_PROVIDER: mock
      E2E_DISABLE_RATE_LIMIT: "1"
      CREDITS_ENFORCED: "true"
      ALLOW_E2E_SEED: "1"
      STRIPE_BACKEND: fake
      E2E_ALL_SPECS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Seed E2E database
        run: |
          python backend/scripts/clean_e2e_db.py
          python backend/scripts/seed_e2e.py
      - name: Start backend
        run: |
          cd backend
          uvicorn server:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/health && break; sleep 1; done
      - name: Start frontend dev server
        run: |
          cd frontend
          npm ci --legacy-peer-deps
          BROWSER=none E2E_PROXY_TARGET=http://127.0.0.1:8000 PORT=3000 npm start &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3000/ && break; sleep 2; done
        env:
          E2E_PROXY_TARGET: http://127.0.0.1:8000
      - name: Run Playwright (${{ matrix.project }})
        run: |
          cd e2e
          npm ci
          npx playwright install --with-deps ${{ matrix.project == 'mobile-safari' && 'webkit' || matrix.project == 'tablet' && 'webkit' || matrix.project }}
          npx playwright test --project=${{ matrix.project }}
        env:
          E2E_BASE_URL: http://127.0.0.1:3000

  accessibility:
    runs-on: ubuntu-latest
    needs: []
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
    env:
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: memoryhub_e2e
      JWT_SECRET: e2e-jwt-secret-at-least-32-characters-long
      ENV: development
      EMAIL_PROVIDER: fake
      ANALYZER_PROVIDER: mock
      E2E_DISABLE_RATE_LIMIT: "1"
      ALLOW_E2E_SEED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r backend/requirements.txt
      - run: |
          python backend/scripts/clean_e2e_db.py
          python backend/scripts/seed_e2e.py
      - run: |
          cd backend && uvicorn server:app --host 127.0.0.1 --port 8000 &
          cd frontend && npm ci --legacy-peer-deps && BROWSER=none E2E_PROXY_TARGET=http://127.0.0.1:8000 PORT=3000 npm start &
          sleep 45
      - run: |
          cd e2e && npm ci && npx playwright install --with-deps chromium
          npm run test:accessibility
        env:
          E2E_BASE_URL: http://127.0.0.1:3000

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.runCommand('ping').ok\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: memoryhub_test
      JWT_SECRET: test-jwt-secret-at-least-32-characters-long
      ENV: development
      EMAIL_PROVIDER: fake
      ANALYZER_PROVIDER: mock
      E2E_DISABLE_RATE_LIMIT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Import server module
        run: python -c "import server; print('server import ok')"
        working-directory: backend
      - name: Pytest
        run: pytest -q
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          CI: true
          REACT_APP_ENV: production

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: memoryhub-backend:ci
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: memoryhub-frontend:ci
          build-args: |
            REACT_APP_ENV=production
      - name: Build nginx image
        uses: docker/build-push-action@v6
        with:
          context: ./deploy/nginx
          push: false
          tags: memoryhub-nginx:ci

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for obvious secrets
        run: |
          set -euo pipefail
          # Fail only on values that look like real secrets (not CHANGE_ME placeholders).
          if rg -n 'sk_live_[a-zA-Z0-9]{16,}|sk_test_[a-zA-Z0-9]{16,}|whsec_[a-zA-Z0-9]{16,}|OPENAI_API_KEY=sk-[a-zA-Z0-9]{16,}' \
            --glob '!**/*.example' --glob '!**/node_modules/**' --glob '!**/.venv/**' . ; then
            echo "Potential live secrets found in tracked files."
            exit 1
          fi
          echo "No live secrets detected in repository."

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.runCommand('ping').ok\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGO_URL: mongodb://localhost:27017
      E2E_DB_NAME: memoryhub_e2e
      DB_NAME: memoryhub_e2e
      JWT_SECRET: e2e-jwt-secret-at-least-32-characters-long
      ENV: development
      EMAIL_PROVIDER: fake
      ANALYZER_PROVIDER: mock
      E2E_DISABLE_RATE_LIMIT: "1"
      CREDITS_ENFORCED: "true"
      ALLOW_E2E_SEED: "1"
      STRIPE_BACKEND: fake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Seed E2E database
        run: |
          python backend/scripts/clean_e2e_db.py
          python backend/scripts/seed_e2e.py
      - name: Start backend
        run: |
          cd backend
          uvicorn server:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/health && break
            sleep 1
          done
      - name: Start frontend dev server (API proxy)
        run: |
          cd frontend
          npm ci --legacy-peer-deps
          BROWSER=none E2E_PROXY_TARGET=http://127.0.0.1:8000 PORT=3000 npm start &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3000/ && break
            sleep 2
          done
        env:
          E2E_PROXY_TARGET: http://127.0.0.1:8000
      - name: Install Playwright and run smoke tests
        run: |
          cd e2e
          npm ci
          npx playwright install --with-deps chromium
          npm run test:chromium
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
          E2E_PROXY_TARGET: http://127.0.0.1:8000

  accessibility:
    runs-on: ubuntu-latest
    needs: [backend]
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
    env:
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: memoryhub_e2e
      JWT_SECRET: e2e-jwt-secret-at-least-32-characters-long
      ENV: development
      EMAIL_PROVIDER: fake
      ANALYZER_PROVIDER: mock
      E2E_DISABLE_RATE_LIMIT: "1"
      ALLOW_E2E_SEED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r backend/requirements.txt
      - run: |
          python backend/scripts/clean_e2e_db.py
          python backend/scripts/seed_e2e.py
      - run: |
          cd backend && uvicorn server:app --host 127.0.0.1 --port 8000 &
          cd frontend && npm ci --legacy-peer-deps && BROWSER=none E2E_PROXY_TARGET=http://127.0.0.1:8000 PORT=3000 npm start &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3000/ && break; sleep 2; done
      - run: |
          cd e2e && npm ci && npx playwright install --with-deps chromium && npm run test:accessibility
        env:
          E2E_BASE_URL: http://127.0.0.1:3000

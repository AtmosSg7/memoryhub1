name: memoryhub

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-backend-env: &backend-env
  MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017}
  LOCAL_UPLOAD_DIR: /app/uploads
  ENV: ${ENV:-production}

services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    command: ["mongod", "--quiet"]
    environment:
      MONGO_INITDB_DATABASE: ${DB_NAME:-memoryhub}
    volumes:
      - mongo_data:/data/db
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging

  backend:
    build:
      context: ./backend
    image: memoryhub-backend:${IMAGE_TAG:-local}
    restart: unless-stopped
    env_file:
      - deploy/.env
    environment:
      <<: *backend-env
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: ${PUBLIC_APP_URL:-}
        REACT_APP_ENV: ${ENV:-production}
        REACT_APP_SENTRY_DSN: ${REACT_APP_SENTRY_DSN:-}
        REACT_APP_SENTRY_TRACES_SAMPLE_RATE: ${REACT_APP_SENTRY_TRACES_SAMPLE_RATE:-0.1}
        REACT_APP_SENTRY_USER_SALT: ${SENTRY_USER_SALT:-}
    image: memoryhub-frontend:${IMAGE_TAG:-local}
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *default-logging

  nginx:
    build:
      context: ./deploy/nginx
    image: memoryhub-nginx:${IMAGE_TAG:-local}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/certs:/etc/nginx/certs:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *default-logging

networks:
  internal:
    driver: bridge

volumes:
  mongo_data:
  uploads_data:

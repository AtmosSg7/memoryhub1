# Local production-like test — self-signed TLS + plain HTTP 8080, no Mongo auth.
# Use: docker compose -f docker-compose.yml -f docker-compose.local-prod.yml up -d --build

services:
  nginx:
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${PLAIN_HTTP_PORT:-8080}:8080"

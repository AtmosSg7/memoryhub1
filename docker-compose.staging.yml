# Staging overrides — plain HTTP on 8080, separate DB, Stripe test mode.
# Use: docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d

services:
  mongo:
    volumes:
      - mongo_staging_data:/data/db

  backend:
    environment:
      ENV: staging
      DB_NAME: ${DB_NAME:-memoryhub_staging}

  frontend:
    build:
      args:
        REACT_APP_ENV: staging

  nginx:
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${PLAIN_HTTP_PORT:-8080}:8080"

volumes:
  mongo_staging_data:

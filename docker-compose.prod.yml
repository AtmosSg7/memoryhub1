# Alias of docker-compose.production.yml (identical services).
# Prefer: docker-compose.production.yml
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file deploy/.env up -d --build

services:
  mongo:
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    command: ["mongod", "--auth", "--quiet"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --quiet --eval \"db.runCommand('ping').ok\" | grep -q 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s
    deploy:
      resources:
        limits:
          memory: 1G

  backend:
    environment:
      ENV: production
      MONGO_URL: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      LOCAL_UPLOAD_DIR: /app/uploads
    deploy:
      resources:
        limits:
          memory: 768M

  frontend:
    deploy:
      resources:
        limits:
          memory: 256M

  nginx:
    # Production publishes only 80/443 (from base compose). Healthcheck uses
    # internal :8080 /health (no TLS), not the public HTTPS listener.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M

  scheduler:
    build:
      context: ./backend
    image: memoryhub-backend:${IMAGE_TAG:-local}
    restart: unless-stopped
    env_file:
      - deploy/.env
    environment:
      ENV: production
      MONGO_URL: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      LOCAL_UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal
    command: ["python", "scripts/run_scheduled_tasks.py", "--loop", "--interval", "300"]
    # Override image HEALTHCHECK (backend HTTP :8000) — scheduler has no HTTP server.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from pathlib import Path; import sys; sys.exit(0 if b'run_scheduled_tasks' in Path('/proc/1/cmdline').read_bytes() else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

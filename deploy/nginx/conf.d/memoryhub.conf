upstream memoryhub_backend {
    server backend:8000;
    keepalive 16;
}

upstream memoryhub_frontend {
    server frontend:80;
    keepalive 16;
}

# HTTP — redirect to HTTPS when TLS certs are present.
server {
    listen 80;
    server_name _;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name _;

    include /etc/nginx/snippets/ssl.conf;
    include /etc/nginx/snippets/security-headers.conf;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK\n";
    }

    location = /health/backend {
        access_log off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_pass http://memoryhub_backend/api/health;
    }

    location = /health/backend/ready {
        access_log off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_pass http://memoryhub_backend/api/ready;
    }

    location = /health/frontend {
        access_log off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://memoryhub_frontend/health;
    }

    # Stripe webhooks — preserve raw body for signature verification.
    location = /api/stripe/webhook {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        client_max_body_size 2m;
        proxy_read_timeout 60s;
        proxy_pass http://memoryhub_backend;
    }

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        client_max_body_size 30m;
        proxy_pass http://memoryhub_backend;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://memoryhub_frontend;
    }
}

# Local / staging without TLS certificates: serve plain HTTP on port 8080 inside the container.
